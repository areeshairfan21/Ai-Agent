<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<title>AI Interview Agent</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

  :root {
    --paper: #f6f1e7;
    --paper-raised: #fffdf8;
    --ink: #2b2620;
    --ink-dim: #8a8072;
    --line: #ddd3bf;
    --rust: #b5502f;
    --rust-dim: #e8d4c8;
    --olive: #6b7a4f;
    --warn: #b5502f;
    --serif: 'Source Serif 4', Georgia, serif;
    --sans: 'Inter', -apple-system, 'Segoe UI', sans-serif;
  }
  [data-theme="dark"] {
    --paper: #1b1815;
    --paper-raised: #262220;
    --ink: #eee6d9;
    --ink-dim: #9a9082;
    --line: #3a352e;
    --rust: #e08a5f;
    --rust-dim: #4a352a;
    --olive: #9db07a;
    --warn: #e08a5f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    height: 100vh;
    display: flex;
    flex-direction: column;
    transition: background 0.2s ease, color 0.2s ease;
  }
  header {
    padding: 18px 28px;
    border-bottom: 2px solid var(--ink);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .brand { display: flex; align-items: baseline; gap: 8px; }
  .brand-name {
    font-family: var(--serif);
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .brand-tag {
    font-size: 11px;
    color: var(--ink-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .header-right { display: flex; align-items: center; gap: 18px; }
  #candidate-label { font-size: 13px; color: var(--ink-dim); }

  #theme-toggle {
    width: 34px; height: 34px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--paper-raised);
    color: var(--ink); cursor: pointer; font-size: 15px;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s ease;
  }
  #theme-toggle:hover { background: var(--line); }

  #tabs { display: none; gap: 2px; border: 1px solid var(--line); border-radius: 20px; padding: 3px; background: var(--paper-raised); }
  #tabs.visible { display: flex; }
  .tab-btn {
    background: none; border: none; color: var(--ink-dim);
    font-size: 12.5px; font-weight: 500; padding: 6px 16px; border-radius: 16px; cursor: pointer;
  }
  .tab-btn.active { background: var(--ink); color: var(--paper); }
  .tab-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  #setup {
    max-width: 460px;
    margin: 60px auto;
    padding: 34px;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 4px;
    box-shadow: 4px 4px 0 var(--line);
  }
  #setup h1 { font-family: var(--serif); font-size: 24px; margin: 0 0 8px; font-weight: 600; }
  #setup p { color: var(--ink-dim); font-size: 13.5px; line-height: 1.55; margin: 0 0 22px; }
  .field { margin-bottom: 18px; }
  .field label {
    display: block; font-size: 11.5px; color: var(--ink-dim);
    text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 7px; font-weight: 500;
  }
  input[type=file] { width: 100%; font-size: 13px; color: var(--ink); }
  select, button.primary {
    width: 100%; padding: 11px 13px; background: var(--paper);
    border: 1px solid var(--ink); color: var(--ink); border-radius: 3px;
    font-size: 14px; font-family: var(--sans);
  }
  button.primary {
    background: var(--rust); color: var(--paper-raised); font-weight: 600;
    border: 1px solid var(--rust); cursor: pointer; margin-top: 8px; transition: opacity 0.15s;
  }
  button.primary:disabled { opacity: 0.4; cursor: not-allowed; }
  button.primary:hover:not(:disabled) { opacity: 0.85; }
  #error { color: var(--warn); font-size: 13px; margin-top: 10px; min-height: 16px; }

  #main-area { flex: 1; overflow: hidden; display: none; flex-direction: column; }
  #main-area.visible { display: flex; }

  /* --- Interview view --- */
  #chat-view { flex: 1; display: none; flex-direction: column; overflow: hidden; }
  #chat-view.active { display: flex; }
  #messages {
    flex: 1; overflow-y: auto; padding: 28px 18%;
    display: flex; flex-direction: column; gap: 16px;
  }
  @media (max-width: 900px) { #messages { padding: 20px 6%; } }
  .msg { display: flex; flex-direction: column; max-width: 74%; }
  .msg.interviewer { align-self: flex-start; }
  .msg.candidate { align-self: flex-end; align-items: flex-end; }
  .msg .who {
    font-size: 11px; color: var(--ink-dim);
    text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 5px; font-weight: 500;
  }
  .bubble { padding: 13px 17px; border-radius: 3px; line-height: 1.55; font-size: 14.5px; white-space: pre-wrap; }
  .msg.interviewer .bubble { background: var(--paper-raised); border: 1px solid var(--line); border-left: 3px solid var(--olive); }
  .msg.candidate .bubble { background: var(--ink); color: var(--paper); border-left: 3px solid var(--rust); }
  .typing { display: flex; gap: 4px; padding: 15px 17px; }
  .typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-dim); animation: bounce 1.2s infinite ease-in-out; }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-4px); opacity: 1; } }

  #composer { border-top: 2px solid var(--ink); padding: 18px 18%; display: flex; gap: 10px; flex-shrink: 0; }
  @media (max-width: 900px) { #composer { padding: 14px 6%; } }
  #composer textarea {
    flex: 1; resize: none; background: var(--paper-raised); border: 1px solid var(--line);
    color: var(--ink); border-radius: 3px; padding: 12px 14px;
    font-family: var(--sans); font-size: 14.5px; line-height: 1.4; max-height: 140px;
  }
  #composer textarea:focus { outline: none; border-color: var(--ink); }
  #composer button {
    padding: 0 24px; background: var(--rust); color: var(--paper-raised); border: 1px solid var(--rust);
    border-radius: 3px; font-weight: 600; cursor: pointer;
  }
  #composer button:disabled { opacity: 0.35; cursor: not-allowed; }

  #done-banner {
    display: none; padding: 16px 18%; border-top: 1px solid var(--line);
    align-items: center; justify-content: space-between; background: var(--paper-raised); flex-shrink: 0;
  }
  @media (max-width: 900px) { #done-banner { padding: 14px 6%; } }
  #done-banner.visible { display: flex; }
  #done-banner span { font-size: 13.5px; color: var(--ink-dim); }
  #view-results-btn {
    background: var(--rust); color: var(--paper-raised); border: 1px solid var(--rust); padding: 10px 22px;
    border-radius: 3px; font-weight: 600; cursor: pointer; font-size: 13.5px;
  }

  /* --- Results view --- */
  #results-view { flex: 1; display: none; overflow-y: auto; }
  #results-view.active { display: block; }
  #results-inner { max-width: 700px; margin: 0 auto; padding: 44px 24px 60px; }
  #results-inner h2 { font-family: var(--serif); font-size: 26px; margin: 0 0 4px; font-weight: 600; }
  #results-inner .sub { color: var(--ink-dim); font-size: 13px; margin-bottom: 26px; }
  .summary-box {
    background: var(--paper-raised); border: 1px solid var(--line); border-left: 3px solid var(--ink);
    border-radius: 3px; padding: 20px 22px; font-family: var(--serif); font-size: 16px;
    line-height: 1.65; margin-bottom: 34px;
  }
  .chart-card {
    background: var(--paper-raised); border: 1px solid var(--line);
    border-radius: 3px; padding: 24px 26px; margin-bottom: 24px;
  }
  .chart-card h3 {
    font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.07em;
    color: var(--ink-dim); margin: 0 0 18px; font-weight: 600;
  }
  .bar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 11px; }
  .bar-label { width: 140px; font-size: 12.5px; color: var(--ink-dim); flex-shrink: 0; text-align: right; }
  .bar-track { flex: 1; background: var(--paper); border: 1px solid var(--line); border-radius: 2px; overflow: hidden; height: 18px; }
  .bar-fill { height: 100%; transition: width 0.6s ease; }
  .bar-value { width: 24px; font-size: 12px; color: var(--ink-dim); }

  .list-card { margin-bottom: 22px; }
  .list-card h3 {
    font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.07em;
    margin: 0 0 10px; font-weight: 600;
  }
  .list-card.strengths h3 { color: var(--olive); }
  .list-card.gaps h3 { color: var(--rust); }
  .list-card.next h3 { color: var(--ink-dim); }
  .list-card ul { margin: 0; padding-left: 20px; line-height: 1.75; font-size: 14.5px; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-name">Interview Agent</div>
    <div class="brand-tag">AI Cohort</div>
  </div>
  <div class="header-right">
    <div id="tabs">
      <button class="tab-btn active" id="tab-interview">Interview</button>
      <button class="tab-btn" id="tab-results" disabled>Results</button>
    </div>
    <div id="candidate-label"></div>
    <button id="theme-toggle" title="Toggle light/dark">🌙</button>
  </div>
</header>

<div id="setup">
  <h1>Start an interview</h1>
  <p>Upload your candidates.json, pick a candidate, and begin.</p>
  <div class="field">
    <label>Candidates file</label>
    <input type="file" id="file-input" accept=".json">
  </div>
  <div class="field">
    <label>Candidate</label>
    <select id="candidate-select" disabled>
      <option>Upload a file first…</option>
    </select>
  </div>
  <button class="primary" id="start-btn" disabled>Start interview</button>
  <div id="error"></div>
</div>

<div id="main-area">
  <div id="chat-view" class="active">
    <div id="messages"></div>
    <div id="done-banner">
      <span>Interview complete.</span>
      <button id="view-results-btn">View results →</button>
    </div>
    <div id="composer">
      <textarea id="input" rows="1" placeholder="Type your answer…"></textarea>
      <button id="send-btn">Send</button>
    </div>
  </div>

  <div id="results-view">
    <div id="results-inner"></div>
  </div>
</div>

<script>
const SERVER_URL = window.location.origin + "/api/interview";

// --- Theme (light/dark) ---
const themeToggle = document.getElementById('theme-toggle');
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
  try { localStorage.setItem('interview-agent-theme', theme); } catch (e) {}
}
(function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem('interview-agent-theme'); } catch (e) {}
  if (saved) {
    applyTheme(saved);
  } else {
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    applyTheme(prefersDark ? 'dark' : 'light');
  }
})();
themeToggle.addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme');
  applyTheme(current === 'dark' ? 'light' : 'dark');
});

let candidates = [];
let sessionId = null;
let busy = false;
let lastFeedback = null;

const fileInput = document.getElementById('file-input');
const candidateSelect = document.getElementById('candidate-select');
const startBtn = document.getElementById('start-btn');
const errorEl = document.getElementById('error');
const setupEl = document.getElementById('setup');
const mainArea = document.getElementById('main-area');
const chatView = document.getElementById('chat-view');
const resultsView = document.getElementById('results-view');
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
const candidateLabel = document.getElementById('candidate-label');
const doneBanner = document.getElementById('done-banner');
const viewResultsBtn = document.getElementById('view-results-btn');
const tabsEl = document.getElementById('tabs');
const tabInterview = document.getElementById('tab-interview');
const tabResults = document.getElementById('tab-results');

fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      candidates = data.candidates || [];
      if (!candidates.length) throw new Error("No candidates found in file.");
      candidateSelect.innerHTML = candidates.map((c, i) =>
        `<option value="${i}">${c.member.name} — ${c.member.jobRole}</option>`
      ).join('');
      candidateSelect.disabled = false;
      startBtn.disabled = false;
      errorEl.textContent = '';
    } catch (err) {
      errorEl.textContent = "Couldn't read that file: " + err.message;
    }
  };
  reader.readAsText(file);
});

startBtn.addEventListener('click', async () => {
  const idx = parseInt(candidateSelect.value, 10);
  const candidate = candidates[idx];
  if (!candidate) return;

  sessionId = 'web-' + Math.random().toString(36).slice(2);
  startBtn.disabled = true;
  startBtn.textContent = 'Connecting…';
  errorEl.textContent = '';

  try {
    const resp = await fetch(SERVER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId, candidate })
    });
    if (!resp.ok) throw new Error(`Server returned ${resp.status}`);
    const data = await resp.json();

    setupEl.style.display = 'none';
    mainArea.classList.add('visible');
    tabsEl.classList.add('visible');
    candidateLabel.textContent = candidate.member.name + ' · ' + candidate.member.jobRole;
    addMessage('interviewer', data.reply);
    inputEl.focus();
  } catch (err) {
    errorEl.textContent = "Couldn't reach the server. Is it running? (" + err.message + ")";
    startBtn.disabled = false;
    startBtn.textContent = 'Start interview';
  }
});

function addMessage(role, text) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  wrap.innerHTML = `<div class="who">${role === 'interviewer' ? 'Interviewer' : 'You'}</div><div class="bubble"></div>`;
  wrap.querySelector('.bubble').textContent = text;
  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function showTyping() {
  const wrap = document.createElement('div');
  wrap.className = 'msg interviewer';
  wrap.id = 'typing-indicator';
  wrap.innerHTML = `<div class="who">Interviewer</div><div class="bubble typing"><span></span><span></span><span></span></div>`;
  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
function hideTyping() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || busy) return;
  busy = true;
  sendBtn.disabled = true;
  addMessage('candidate', text);
  inputEl.value = '';
  inputEl.style.height = 'auto';
  showTyping();

  try {
    const resp = await fetch(SERVER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId, message: text })
    });
    if (!resp.ok) throw new Error(`Server returned ${resp.status}`);
    const data = await resp.json();
    hideTyping();
    addMessage('interviewer', data.reply);

    if (data.done) {
      lastFeedback = data.feedback;
      doneBanner.classList.add('visible');
      tabResults.disabled = false;
      inputEl.disabled = true;
      sendBtn.disabled = true;
    }
  } catch (err) {
    hideTyping();
    addMessage('interviewer', "[Connection error: " + err.message + "]");
  } finally {
    busy = false;
    if (!inputEl.disabled) { sendBtn.disabled = false; inputEl.focus(); }
  }
}

viewResultsBtn.addEventListener('click', () => switchTab('results'));
tabInterview.addEventListener('click', () => switchTab('interview'));
tabResults.addEventListener('click', () => { if (!tabResults.disabled) switchTab('results'); });

function switchTab(which) {
  if (which === 'results') {
    chatView.classList.remove('active');
    resultsView.classList.add('active');
    tabResults.classList.add('active');
    tabInterview.classList.remove('active');
    if (lastFeedback) renderResults(lastFeedback);
  } else {
    resultsView.classList.remove('active');
    chatView.classList.add('active');
    tabInterview.classList.add('active');
    tabResults.classList.remove('active');
  }
}

function renderResults(fb) {
  const container = document.getElementById('results-inner');

  // Module coverage chart data: count topics covered per module (1-8)
  const moduleNames = {
    1: 'Environment & Tooling', 2: 'Data Foundations', 3: 'Embeddings & Vector Search',
    4: 'LLM Core & Prompting', 5: 'Chatbot Build', 6: 'Agentic AI & MCP',
    7: 'Eval, Security & Deploy', 8: 'Production & Capstone'
  };
  const moduleCounts = {};
  (fb.topicsCovered || []).forEach(t => { moduleCounts[t.module] = (moduleCounts[t.module] || 0) + 1; });
  const maxModuleCount = Math.max(1, ...Object.values(moduleCounts));

  const moduleBarsHtml = Object.keys(moduleNames).map(m => {
    const count = moduleCounts[m] || 0;
    const pct = (count / maxModuleCount) * 100;
    return `
      <div class="bar-row">
        <div class="bar-label">${moduleNames[m]}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:var(--olive);"></div></div>
        <div class="bar-value">${count}</div>
      </div>`;
  }).join('');

  // Strengths vs Gaps chart
  const sCount = fb.strengthsCount ?? (fb.strengths || []).length;
  const gCount = fb.gapsCount ?? (fb.gaps || []).length;
  const maxSG = Math.max(1, sCount, gCount);

  container.innerHTML = `
    <h2>Interview Results</h2>
    <div class="sub">Structured feedback</div>
    <div class="summary-box">${escapeHtml(fb.summary)}</div>

    <div class="chart-card">
      <h3>Strengths vs Gaps</h3>
      <div class="bar-row">
        <div class="bar-label">Strengths</div>
        <div class="bar-track"><div class="bar-fill" style="width:${(sCount/maxSG)*100}%; background:var(--olive);"></div></div>
        <div class="bar-value">${sCount}</div>
      </div>
      <div class="bar-row">
        <div class="bar-label">Gaps</div>
        <div class="bar-track"><div class="bar-fill" style="width:${(gCount/maxSG)*100}%; background:var(--warn);"></div></div>
        <div class="bar-value">${gCount}</div>
      </div>
    </div>

    <div class="chart-card">
      <h3>Topics Covered by Module</h3>
      ${moduleBarsHtml}
    </div>

    <div class="list-card strengths">
      <h3>Strengths</h3>
      <ul>${(fb.strengths || []).map(s => `<li>${escapeHtml(s)}</li>`).join('')}</ul>
    </div>
    <div class="list-card gaps">
      <h3>Gaps</h3>
      <ul>${(fb.gaps || []).map(g => `<li>${escapeHtml(g)}</li>`).join('')}</ul>
    </div>
    <div class="list-card next">
      <h3>Next steps</h3>
      <ul>${(fb.next || []).map(n => `<li>${escapeHtml(n)}</li>`).join('')}</ul>
    </div>
  `;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

sendBtn.addEventListener('click', sendMessage);
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
});
</script>

</body>
</html>
